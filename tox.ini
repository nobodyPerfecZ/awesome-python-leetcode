[tox]
isolated_build = true
envlist = py310
skipsdist = true

[testenv]
description = Run tests, linters, type checks, dependency checks, and security scans
allowlist_externals = uv
setenv =
    UV_NO_PROGRESS = 1
commands =
    # Install all dependencies
    uv sync --active --group dev

    # Code formatting
    uv run --active ruff check --fix awesome_python_leetcode tests
    uv run --active ruff format awesome_python_leetcode tests

    # Markdown linting
    uv run --active rumdl check --fix README.md GEMINI.md CLAUDE.md

    # Type checking
    uv run --active ty check awesome_python_leetcode tests

    # Dependency checks
    uv run --active deptry awesome_python_leetcode tests

    # Security linting
    uv run --active bandit -r awesome_python_leetcode tests -ll -f custom

    # Run tests
    uv run --active pytest tests