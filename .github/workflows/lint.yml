name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10"]
    name: Lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    steps:
      - name: Set up the repository
        uses: actions/checkout@v4

      - name: Configure Git to use PAT for private dependencies
        run: |
          git config --global url."https://${{ secrets.GH_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Code Formatting Check (Ruff)
        run: |
          uv run ruff format --check awesome_python_leetcode tests

      - name: Linting Check (Ruff)
        run: |
          uv run ruff check awesome_python_leetcode tests

      - name: Markdown Linting (rumdl)
        run: |
          uv run rumdl check README.md AGENTS.md

      - name: Type Checking (ty)
        run: |
          uv run ty check awesome_python_leetcode tests

      - name: Dependency Check (deptry)
        run: |
          uv run deptry awesome_python_leetcode tests

      - name: Security Scan (bandit)
        run: |
          uv run bandit -r awesome_python_leetcode tests -ll -f custom
