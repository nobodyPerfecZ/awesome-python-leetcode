[project]
name = "awesome-python-leetcode"
version = "0.0.1"
description = "Python Solutions for LeetCode Problems!"
authors = [{ name = "Dennis Jabs" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = ["numpy>=2.2.5"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.1",
    "rumdl>=0.2.15",
    "tox-uv>=1.35.2",
    "ty>=0.0.49",
]

[project.urls]
Homepage = "https://github.com/nobodyPerfecZ/python-project-template"
Issues = "https://github.com/nobodyPerfecZ/python-project-template/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 88
lint.ignore = ["E203"]
lint.select = ["E", "F", "B", "I"]
lint.mccabe.max-complexity = 10
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awesome_python_leetcode"]
